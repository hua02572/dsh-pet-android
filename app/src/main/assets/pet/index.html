<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { width: 100%; height: 100%; display: block; }
  video { position: absolute; left: -100px; top: -100px; width: 1px; height: 1px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="player" playsinline muted></video>
<script>
// 所有素材的 alpha 边界已在桌面 Chromium 中每 0.2 秒预采样。
// 手机只按播放时间查表，不依赖 WebView 的像素读取或 JavascriptInterface 回调。
const canvas = document.getElementById('stage');
const video = document.getElementById('player');
const ctx = canvas.getContext('2d');
let CFG = null, BOUNDS = null, currentFile = '', running = false;
let drawBox = null;

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function pickChainCategory() {
  const weights = CFG.weights || { idle: 10, actions: 5 };
  const total = (weights.idle || 0) + (weights.actions || 0);
  let r = Math.random() * total;
  if ((r -= (weights.idle || 0)) < 0 && CFG.idle.length) return CFG.idle;
  return CFG.actions.length ? CFG.actions : CFG.idle;
}

function boxAt(time) {
  const clip = BOUNDS && BOUNDS.clips[currentFile];
  if (!clip) return drawBox;
  const index = Math.min(clip.frames.length - 1, Math.floor(time / BOUNDS.step));
  // 相邻采样合并，给动作移动和安卓端 80ms 读取间隔留出余量。
  let left = 640, top = 360, right = 0, bottom = 0;
  for (let i = Math.max(0, index - 1); i <= Math.min(clip.frames.length - 1, index + 1); i++) {
    const f = clip.frames[i];
    if (!f) continue;
    left = Math.min(left, f[0]); top = Math.min(top, f[1]);
    right = Math.max(right, f[0] + f[2]); bottom = Math.max(bottom, f[1] + f[3]);
  }
  if (right <= left || bottom <= top) return drawBox;
  return { l: left / 640, t: top / 360, w: (right - left) / 640, h: (bottom - top) / 360 };
}

function playFile(file) {
  currentFile = file;
  drawBox = boxAt(0);
  video.src = 'file:///android_asset/pet/webm/' + encodeURIComponent(file);
  video.play().catch(() => setTimeout(playChain, 300));
}

function playChain() {
  if (running && CFG) playFile(pick(pickChainCategory()));
}

window.petTap = function () {
  if (running && CFG && CFG.tap.length) playFile(pick(CFG.tap));
};

window.startPet = function () {
  if (running || !window.__PET_CONFIG__ || !window.__PET_BOUNDS__) return;
  CFG = window.__PET_CONFIG__; BOUNDS = window.__PET_BOUNDS__;
  if (!CFG.idle.length) return;
  running = true;
  // 与安卓窗口加载前使用的初始边界对应。
  playFile(CFG.idle[0]);
};

window.getPetBox = function () {
  drawBox = boxAt(video.currentTime || 0);
  if (!drawBox) return null;
  return { ...drawBox, cw: canvas.clientWidth, ch: canvas.clientHeight, file: currentFile };
};

video.addEventListener('ended', playChain);

function frame() {
  if (video.readyState >= 2 && drawBox) {
    const cw = Math.max(1, Math.round(canvas.clientWidth * devicePixelRatio));
    const ch = Math.max(1, Math.round(canvas.clientHeight * devicePixelRatio));
    if (canvas.width !== cw) canvas.width = cw;
    if (canvas.height !== ch) canvas.height = ch;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(video, drawBox.l * 640, drawBox.t * 360, drawBox.w * 640, drawBox.h * 360,
      0, 0, cw, ch);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
