<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="player" playsinline muted style="display:none"></video>
<script>
// ===== 动画链（复刻 dsh-pet 桌面版权重逻辑，无 AI 功能） =====
// 额外能力：实时测量每帧宠物的不透明边界（alpha bbox），报告给安卓端
// 把悬浮窗动态缩到贴合宠物本体——两侧空白不再遮挡屏幕。

const canvas = document.getElementById('stage');
const video = document.getElementById('player');
const ctx = canvas.getContext('2d');
const off = document.createElement('canvas');
off.width = 640; off.height = 360;
const octx = off.getContext('2d', { willReadFrequently: true });

let CFG = null;
let currentMode = 'chain';
let running = false;
let box = null;            // 当前测量到的宠物边界（源视频 640x360 像素坐标）
let lastSentBox = null;

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function pickChainCategory() {
  const w = (CFG && CFG.weights) || { idle: 10, actions: 5 };
  const total = (w.idle || 0) + (w.actions || 0);
  let r = Math.random() * total;
  if ((r -= (w.idle || 0)) < 0 && CFG.idle.length) return CFG.idle;
  return CFG.actions.length ? CFG.actions : CFG.idle;
}

function assetUrl(file) {
  return 'file:///android_asset/pet/webm/' + encodeURIComponent(file);
}

function playChain() {
  if (!running || !CFG) return;
  currentMode = 'chain';
  const cat = pickChainCategory();
  video.src = assetUrl(pick(cat));
  video.play().catch(() => setTimeout(playChain, 300));
}

function playTap() {
  if (!running || !CFG || !CFG.tap.length) return;
  currentMode = 'tap';
  video.src = assetUrl(pick(CFG.tap));
  video.play().catch(() => setTimeout(playChain, 300));
}

window.petTap = playTap;

window.startPet = function () {
  if (running) return;
  if (!window.__PET_CONFIG__) return;
  CFG = window.__PET_CONFIG__;
  if (!CFG.idle.length) return;
  running = true;
  playChain();
};

video.addEventListener('ended', () => playChain());

// ===== alpha 边界测量（浏览器能读到 VP9 alpha；抽行采样 + 24 阈值抗噪） =====
function measure() {
  if (video.readyState < 2) return;
  octx.clearRect(0, 0, 640, 360);
  octx.drawImage(video, 0, 0, 640, 360);
  let d;
  try { d = octx.getImageData(0, 0, 640, 360).data; } catch (e) { return; }
  let minX = 640, minY = 360, maxX = -1, maxY = -1;
  for (let y = 0; y < 360; y += 2) {
    const row = y * 640 * 4;
    for (let x = 0; x < 640; x += 2) {
      if (d[row + x * 4 + 3] > 24) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return;
  minX = Math.max(0, minX - 8); minY = Math.max(0, minY - 8);
  maxX = Math.min(639, maxX + 8); maxY = Math.min(359, maxY + 8);
  const b = { l: minX / 640, t: minY / 360, w: (maxX - minX + 1) / 640, h: (maxY - minY + 1) / 360 };
  if (lastSentBox &&
      Math.abs(lastSentBox.l - b.l) < 0.03 && Math.abs(lastSentBox.w - b.w) < 0.03 &&
      Math.abs(lastSentBox.t - b.t) < 0.03 && Math.abs(lastSentBox.h - b.h) < 0.03) return;
  lastSentBox = b;
  box = b;
  if (window.PetBox) window.PetBox.onBox(b.l, b.t, b.w, b.h);
}
video.addEventListener('timeupdate', measure);   // ~4Hz 节流
video.addEventListener('loadeddata', measure);

// ===== 绘制：按测得边界做源裁剪，宠物撑满整个悬浮窗 =====
function frame() {
  if (video.readyState >= 2) {
    const cw = canvas.width = canvas.clientWidth * devicePixelRatio;
    const ch = canvas.height = canvas.clientHeight * devicePixelRatio;
    ctx.clearRect(0, 0, cw, ch);
    if (box) {
      ctx.drawImage(video, box.l * 640, box.t * 360, box.w * 640, box.h * 360, 0, 0, cw, ch);
    } else {
      ctx.drawImage(video, 0, 0, cw, ch);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
