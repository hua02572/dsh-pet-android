<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="player" playsinline muted style="display:none"></video>
<script>
// ===== 动画链（复刻 dsh-pet 桌面版权重逻辑，无 AI 功能） =====
// 窗口注入 window.__PET_CONFIG__ = { idle:[], actions:[], tap:[], weights:{idle,actions} }
// 待机/动作播完按权重随机衔接；轻点窗口 → 随机播一个"点击回应"，播完回链。

const canvas = document.getElementById('stage');
const video = document.getElementById('player');
const ctx = canvas.getContext('2d');

let CFG = null;
let currentMode = 'chain';   // chain | tap
let running = false;

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// 权重随机选类别：idle:10 / actions:5（与桌面版默认一致）
function pickChainCategory() {
  const w = (CFG && CFG.weights) || { idle: 10, actions: 5 };
  const total = (w.idle || 0) + (w.actions || 0);
  let r = Math.random() * total;
  if ((r -= (w.idle || 0)) < 0 && CFG.idle.length) return CFG.idle;
  return CFG.actions.length ? CFG.actions : CFG.idle;
}

function assetUrl(file) {
  return 'file:///android_asset/pet/webm/' + encodeURIComponent(file);
}

function playChain() {
  if (!running || !CFG) return;
  currentMode = 'chain';
  const cat = pickChainCategory();
  video.src = assetUrl(pick(cat));
  video.play().catch(() => setTimeout(playChain, 300));
}

function playTap() {
  if (!running || !CFG || !CFG.tap.length) return;
  currentMode = 'tap';
  video.src = assetUrl(pick(CFG.tap));
  video.play().catch(() => setTimeout(playChain, 300));
}

window.petTap = playTap;

window.startPet = function () {
  if (running) { return; }
  if (!window.__PET_CONFIG__) return;
  CFG = window.__PET_CONFIG__;
  if (!CFG.idle.length) return;
  running = true;
  playChain();
};

video.addEventListener('ended', () => {
  if (currentMode === 'tap') playChain(); else playChain();
});

// 尺寸自适应（悬浮窗尺寸固定，ratio 16:9）
function fit() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
}
window.addEventListener('resize', fit);

// 逐帧绘制：Canvas 保留视频 alpha 通道，页面背景透明 → 悬浮窗透出桌面
function frame() {
  if (video.readyState >= 2) {
    fit();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
